[package]
name = "guitarocr-native-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native desktop project persistence and local model process support"

[dependencies]
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
unicode-casefold = "0.2"
unicode-normalization = "0.1"
regex = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
