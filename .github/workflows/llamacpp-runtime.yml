name: Build inference runtime
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Only rebuild when the inference runtime changes'
        required: true
        type: choice
        default: windows-x64-cuda
        options: [windows-x64-cpu, windows-x64-cuda, macos-arm64-metal]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ${{ startsWith(inputs.target, 'windows') && 'windows-2022' || 'macos-15' }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8019dc563b1ecbae6b161a70c3a1359f1b206c1e
          path: .runtime-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Jimver/cuda-toolkit@v0.2.24
        if: inputs.target == 'windows-x64-cuda'
        with:
          cuda: '12.8.1'
          method: network
      - name: Build runtime
        run: >-
          python scripts/build_llamacpp_runtime.py
          --source .runtime-source --build output/runtime-build
          --output output/runtime-artifacts --target ${{ inputs.target }}
          --release-tag v0.1.0-resources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GuitarOCR-runtime-${{ inputs.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            output/runtime-artifacts/*
            output/runtime-build/bin/Release/*.exe
            output/runtime-build/bin/Release/*.dll
