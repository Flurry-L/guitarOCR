name: Export auxiliary models
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact source commit matching the draft release'
        required: true
        type: string
      release_tag:
        description: 'Draft release to receive the ONNX models'
        required: true
        type: string
permissions:
  contents: write
jobs:
  auxiliary:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release source
        shell: python
        run: |
          import json, os, subprocess
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft,targetCommitish']))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert release['isDraft'] and release['targetCommitish'] == head
          assert os.environ['RELEASE_TAG'] == 'v0.1.0'
      - run: git lfs pull --include='weights/layout/**,weights/measure_ocr/**'
      - name: Install build-only conversion tools
        run: |
          python -m pip install 'torch==2.14.0' 'torchvision==0.29.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'onnx==1.23.0' safetensors 'numpy==2.2.6' Pillow
          python -m venv /tmp/paddle-converter
          /tmp/paddle-converter/bin/python -m pip install 'paddlepaddle==3.2.0' 'paddle2onnx==2.1.0' 'onnx==1.17.0' 'numpy==1.26.4'
      - run: python scripts/export_auxiliary.py --paddle-python /tmp/paddle-converter/bin/python
      - name: Upload ONNX assets
        shell: python
        run: |
          import json, os, shutil, subprocess
          from pathlib import Path
          catalog = json.loads(Path('weights/distribution.json').read_text())
          folder = Path('output/model-assets')
          folder.mkdir(parents=True, exist_ok=True)
          for item in catalog['files']['auxiliary']:
              source = Path('output/distribution') / item['path']
              assert source.stat().st_size == item['bytes'], f'Unexpected conversion size: {source}: {source.stat().st_size}'
              target = folder / item['asset']
              shutil.move(source, target)
              subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], str(target), '--clobber'], check=True)
