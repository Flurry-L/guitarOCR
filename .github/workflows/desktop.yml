name: Build desktop installers
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload installers to this draft release (optional)'
        required: false
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-arm64, macos-x64]
permissions:
  contents: read
jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["linux-x64","windows-x64","macos-arm64","macos-x64"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-22.04","windows-x64":"windows-latest","macos-arm64":"macos-15","macos-x64":"macos-15-intel"}')[matrix.platform] }}
    env:
      PYTHONUTF8: '1'
      LDAI_COMP: zstd
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: python scripts/prepare_desktop.py
      - run: npm run build -- --verbose --bundles ${{ matrix.platform == 'linux-x64' && 'deb,appimage' || matrix.platform == 'windows-x64' && 'nsis' || 'dmg' }} -- --locked
        working-directory: desktop
      - name: Check release asset sizes
        shell: python
        run: |
          from pathlib import Path
          for path in Path('desktop/src-tauri/target/release/bundle').rglob('*'):
              if path.suffix in {'.exe', '.dmg', '.deb', '.AppImage'} and path.is_file():
                  assert path.stat().st_size < 2**31, f'{path} exceeds the GitHub asset limit'
      - if: inputs.release_tag != '' && matrix.platform == 'linux-x64'
        run: |
          git lfs pull --include='weights/**'
          python scripts/package_release.py --output output/releases
      - name: Upload to draft release
        if: inputs.release_tag != ''
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import json, os, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          assert tag == f'v{version}', 'Release tag must match the app version'
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft']))
          assert release['isDraft'], 'Only draft releases can receive new builds'
          assets = [p for p in Path('desktop/src-tauri/target/release/bundle').rglob('*')
                    if p.is_file() and p.suffix in {'.exe', '.dmg', '.deb', '.AppImage'}]
          assets += list(Path('output/releases').glob('GuitarOCR-*.zip'))
          assets += list(Path('output/releases/models').glob('*'))
          assert assets, 'No release assets built'
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, assets), '--clobber'], check=True)
      - uses: actions/upload-artifact@v4
        if: inputs.release_tag == ''
        with:
          name: GuitarOCR-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
