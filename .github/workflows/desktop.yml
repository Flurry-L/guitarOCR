name: Build desktop installers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - runner: windows-latest
            platform: windows-x64
            bundles: nsis
          - runner: macos-15
            platform: macos-arm64
            bundles: dmg
          - runner: macos-15-intel
            platform: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: '1'
      APPIMAGE_COMP: xz
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
      - uses: actions/cache@v4
        with:
          path: |
            tools/models/GLM-OCR
            tools/model-bundles
          key: desktop-models-${{ hashFiles('weights/manifest.json') }}
      - run: python scripts/prepare_desktop.py --fetch-models
      - run: node --test tests/score-editor.test.mjs
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: npm run build -- --bundles ${{ matrix.bundles }} -- --locked
        working-directory: desktop
      - name: Check release asset sizes
        shell: python
        run: |
          from pathlib import Path
          for path in Path('desktop/src-tauri/target/release/bundle').rglob('*'):
              if path.suffix in {'.exe', '.dmg', '.deb', '.AppImage'} and path.is_file():
                  assert path.stat().st_size < 2**31, f'{path} exceeds the GitHub asset limit'
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarOCR-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
