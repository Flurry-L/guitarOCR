name: Build desktop applications
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Client to build'
        required: true
        type: choice
        default: all
        options: [all, windows-x64, macos-arm64]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows-x64","macos-arm64"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2022' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: desktop
      - name: Acquire native libraries
        run: >-
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all:
          --no-deps onnxruntime==1.23.2 pypdfium2==5.13.0 --dest output/native-wheels
      - name: Stage prebuilt inference runtime
        shell: python
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          import json, os, subprocess, sys, urllib.request
          from pathlib import Path
          target = os.environ['NATIVE_PLATFORM'] + ('-metal' if os.environ['NATIVE_PLATFORM'] == 'macos-arm64' else '-cpu')
          catalog = json.loads(Path('scripts/llamacpp-runtime.json').read_text())
          entry = catalog['artifacts'][target]
          artifacts = Path('output/runtime-artifacts')
          artifacts.mkdir(parents=True, exist_ok=True)
          archive = artifacts / entry['url'].rsplit('/', 1)[1]
          urllib.request.urlretrieve(entry['url'], archive)
          manifest = artifacts / (target + '.json')
          manifest.write_text(json.dumps({target: entry}))
          wheels = Path('output/native-wheels')
          subprocess.run([sys.executable, 'scripts/collect_native_assets.py', '--target', target,
              '--ort-archive', str(next(wheels.glob('onnxruntime-*.whl'))),
              '--pdfium-wheel', str(next(wheels.glob('pypdfium2-*.whl'))),
              '--llama-archive', str(archive), '--llama-manifest', str(manifest),
              '--output', 'output/native-components'], check=True)
          executable = Path('output/native-components/llama.cpp') / entry['executable']
          executable.chmod(0o755)
          subprocess.run([str(executable), '--version'], check=True, timeout=30)
          help_text = subprocess.check_output([str(executable), '--help'], text=True, timeout=30)
          for option in ('--cors-origins', '--no-cors-credentials', '--mmproj-device',
                         '--no-webui', '--lora-init-without-apply'):
              if option not in help_text:
                  raise RuntimeError(f'Packaged inference runtime lacks {option}')
          devices = subprocess.check_output([str(executable), '--list-devices'], text=True, timeout=30)
          if 'Available devices:' not in devices:
              raise RuntimeError('Packaged inference runtime cannot list its devices')
          print(devices)
      - run: npm run native:build
        working-directory: desktop
      - run: npm run resources -- --manifest ../output/native-components/manifest.json --require-inference
        working-directory: desktop
      - run: npm run build -- --verbose --bundles ${{ matrix.platform == 'windows-x64' && 'nsis' || 'dmg' }} -- --locked
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GuitarOCR-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
