name: Check code
on: workflow_dispatch
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked --python 3.11 --extra webui --extra dev
      - run: uv run --no-sync ruff check datagen layout document_info measure_ocr gp5_export pipeline shared webapp scripts examples tests
      - run: uv run --no-sync python -m unittest discover -s tests -v
