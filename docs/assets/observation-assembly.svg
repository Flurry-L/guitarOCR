<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">从局部观察到跨小节关系</title>
  <desc id="desc">两个开放式论文子图。左图展示跨小节延音：一弦五品延至下一节，后一节的品位没有印出，局部观察保留 fret 为 null；两节端点连接后，组装结果恢复五品并标记 tie。右图展示 PM 范围线：前节印有 PM 标签，后节只有无标签延伸线，局部 kind 为 null，组装后接回同一 PM 范围。虚线矩形表示各自独立输入的当前小节裁图。下方为真实字段节选，原观察中的空值保持不变。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #263247; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 24px; }
      .label { font-size: 22px; }
      .note { font-size: 20px; fill: #748091; }
      .muted { fill: #748091; }
      .coral { fill: #D4876C; }
      .indigo { fill: #7079B8; }
      .teal { fill: #4D938A; }
      .code { font-family: 'DejaVu Sans Mono', 'Noto Sans CJK SC', 'Microsoft YaHei', monospace; font-size: 24px; fill: #7079B8; }
      .staff { fill: none; stroke: #AAB3BF; stroke-width: 1.5; }
      .bar { fill: none; stroke: #48556A; stroke-width: 2; }
      .crop { fill: none; stroke: #D4876C; stroke-width: 1.8; stroke-dasharray: 7 6; }
      .evidence { fill: none; stroke: #D4876C; stroke-width: 3; stroke-linecap: round; }
      .observation-link { fill: none; stroke: #7079B8; stroke-width: 2; }
    </style>
    <marker id="coral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#D4876C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#4D938A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#FFFFFF"/>
  <text x="54" y="58" class="title">从局部观察到跨小节关系</text>
  <text x="1384" y="56" text-anchor="end" class="label muted">谱面示意　/　字段节选</text>
  <path d="M54 88 H1384" stroke="#E1E5EB" stroke-width="1.5"/>
  <path d="M720 119 V842" stroke="#E1E5EB" stroke-width="1.5"/>

  <!-- (a) A continuous tie, viewed through two independent measure crops. -->
  <text x="54" y="139" class="heading"><tspan class="muted">(a)</tspan>　延音与未印出的品位</text>
  <text x="87" y="190" class="label coral">小节 n</text>
  <text x="382" y="190" class="label coral">小节 n+1</text>
  <rect x="72" y="208" width="283" height="202" rx="9" class="crop"/>
  <rect x="355" y="208" width="283" height="202" rx="9" class="crop"/>

  <g class="staff">
    <path d="M87 286 H622 M87 302 H622 M87 318 H622 M87 334 H622 M87 350 H622 M87 366 H622"/>
  </g>
  <path d="M87 284 V368 M355 284 V368 M622 284 V368" class="bar"/>
  <text x="105" y="269" class="label muted">4/4</text>
  <rect x="166" y="266" width="31" height="38" fill="#FFFFFF"/>
  <text x="181" y="300" text-anchor="middle" font-size="43" font-weight="700" class="coral">5</text>
  <path d="M198 276 C269 212 418 212 496 276" class="evidence"/>
  <text x="182" y="395" text-anchor="middle" class="note">一弦 5 品 · 整音符</text>
  <text x="496" y="395" text-anchor="middle" class="note">未印品位 · 整音符</text>

  <!-- A little color is reserved for the actual observations and their flow. -->
  <path d="M214 422 V459 M497 422 V459" fill="none" stroke="#D4876C" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#coral-arrow)"/>
  <text x="86" y="492" class="label indigo">观察 n</text>
  <text x="381" y="492" class="label indigo">观察 n+1</text>
  <path d="M86 507 H329 M381 507 H624" stroke="#DCE0F0" stroke-width="2"/>
  <text x="86" y="541" class="code">fret: 5</text>
  <text x="381" y="541" class="code">fret: <tspan fill="#D4876C" font-weight="700">null</tspan></text>
  <text x="86" y="576" class="code">end: "right"</text>
  <text x="381" y="576" class="code">start: "left"</text>
  <text x="86" y="611" class="code">kind: "tie"</text>
  <text x="381" y="611" class="code">kind: "tie"</text>

  <path d="M214 630 V650 Q214 664 228 664 H355 M497 630 V650 Q497 664 483 664 H355" class="observation-link"/>
  <circle cx="355" cy="664" r="5" fill="#4D938A"/>
  <path d="M355 669 V710" fill="none" stroke="#4D938A" stroke-width="2.3" marker-end="url(#teal-arrow)"/>
  <text x="375" y="699" class="note">同弦、相邻、时值连续</text>

  <rect x="72" y="729" width="566" height="84" rx="12" fill="#EAF4F1"/>
  <rect x="72" y="729" width="5" height="84" rx="2.5" fill="#4D938A"/>
  <text x="95" y="761" class="note" style="fill:#4D938A">第 n+1 节 · resolved / IR</text>
  <text x="95" y="796" class="body">一弦 5 品继续发声 <tspan class="teal">(tie)</tspan></text>
  <text x="355" y="850" text-anchor="middle" class="note">原始观察仍保留 <tspan fill="#D4876C">fret: null</tspan></text>

  <!-- (b) Two extension fragments joined into one labelled PM range. -->
  <text x="766" y="139" class="heading"><tspan class="muted">(b)</tspan>　范围线与未重复的标签</text>
  <text x="799" y="190" class="label coral">小节 n</text>
  <text x="1094" y="190" class="label coral">小节 n+1</text>
  <rect x="784" y="208" width="283" height="202" rx="9" class="crop"/>
  <rect x="1067" y="208" width="283" height="202" rx="9" class="crop"/>

  <g class="staff">
    <path d="M799 286 H1334 M799 302 H1334 M799 318 H1334 M799 334 H1334 M799 350 H1334 M799 366 H1334"/>
  </g>
  <path d="M799 284 V368 M1067 284 V368 M1334 284 V368" class="bar"/>
  <text x="869" y="260" class="body coral" font-weight="700">P.M.</text>
  <path d="M934 249 H1208" class="evidence" stroke-dasharray="10 7"/>
  <path d="M1208 249 V263" class="evidence"/>
  <rect x="878" y="266" width="31" height="38" fill="#FFFFFF"/>
  <rect x="1193" y="266" width="31" height="38" fill="#FFFFFF"/>
  <text x="893" y="300" text-anchor="middle" font-size="43" font-weight="700">5</text>
  <text x="1208" y="300" text-anchor="middle" font-size="43" font-weight="700">5</text>
  <text x="894" y="395" text-anchor="middle" class="note">PM 标签与延伸线</text>
  <text x="1208" y="395" text-anchor="middle" class="note">只有续线，末端可见</text>

  <path d="M926 422 V459 M1209 422 V459" fill="none" stroke="#D4876C" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#coral-arrow)"/>
  <text x="798" y="492" class="label indigo">观察 n</text>
  <text x="1093" y="492" class="label indigo">观察 n+1</text>
  <path d="M798 507 H1041 M1093 507 H1336" stroke="#DCE0F0" stroke-width="2"/>
  <text x="798" y="541" class="code">kind: "pm"</text>
  <text x="1093" y="541" class="code">kind: <tspan fill="#D4876C" font-weight="700">null</tspan></text>
  <text x="798" y="576" class="code">end: "right"</text>
  <text x="1093" y="576" class="code">start: "left"</text>
  <text x="798" y="611" class="note">保留可见标签与线段</text>
  <text x="1093" y="611" class="code">end: [0,0]</text>

  <path d="M926 630 V650 Q926 664 940 664 H1067 M1209 630 V650 Q1209 664 1195 664 H1067" class="observation-link"/>
  <circle cx="1067" cy="664" r="5" fill="#4D938A"/>
  <path d="M1067 669 V710" fill="none" stroke="#4D938A" stroke-width="2.3" marker-end="url(#teal-arrow)"/>
  <text x="1087" y="699" class="note">接回前节已标明的范围</text>

  <rect x="784" y="729" width="566" height="84" rx="12" fill="#EAF4F1"/>
  <rect x="784" y="729" width="5" height="84" rx="2.5" fill="#4D938A"/>
  <text x="807" y="761" class="note" style="fill:#4D938A">组装后的范围 · 覆盖两节相应事件</text>
  <text x="807" y="796" class="body teal" font-weight="700">PM</text>
  <path d="M861 786 H910 M1044 786 H1127" stroke="#4D938A" stroke-width="3"/>
  <text x="924" y="796" class="body">小节 n</text>
  <text x="1141" y="796" class="body">小节 n+1</text>
  <text x="1067" y="850" text-anchor="middle" class="note">原始观察仍保留 <tspan fill="#D4876C">kind: null</tspan></text>
</svg>
