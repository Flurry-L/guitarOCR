<text x="36" y="91" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#52657D" text-anchor="start">图像中的符号先成为局部观察，再在整谱中获得音乐含义。</text>
