<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="748" viewBox="0 0 1440 748" role="img" aria-labelledby="title desc">
<title id="title">GuitarOCR：从页面到可编辑乐谱</title>
<desc id="desc">页面定位后，信息模型与结构网络确定音轨、谱表及小节位置。小节模型读取当前一张图，输出state、voices和relations。音乐核心按顺序继承状态、连接跨节关系和计算音高，输出ScoreIR用于编辑和导出。原始图像与观察保留在项目中。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#52657D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
