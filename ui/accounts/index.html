<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GuitarOCR · 账号</title>
    <link rel="stylesheet" href="/server-static/style.css" />
    <script type="module" src="/static/theme.js"></script>
    <script type="module" src="/server-static/app.js"></script>
  </head>
  <body class="signed-out">
    <aside class="app-sidebar" aria-label="主导航">
      <a class="brand" href="/workbench">Guitar<span>OCR</span></a>
      <nav class="app-nav">
        <a href="/workbench" title="返回乐谱"><span class="nav-symbol" aria-hidden="true" data-icon="workbench"></span><span class="nav-label">返回乐谱</span></a>
        <button data-view="account" title="账号设置"><span class="nav-symbol" aria-hidden="true" data-icon="settings"></span><span class="nav-label">账号</span></button>
        <button data-view="admin" id="adminTab" title="用户与任务" hidden><span class="nav-symbol" aria-hidden="true" data-icon="admin"></span><span class="nav-label">管理</span></button>
      </nav>
      <div class="sidebar-bottom"><button id="logout" class="quiet sidebar-action">退出登录</button></div>
    </aside>
    <header class="app-header"><h1 id="screenTitle">账号设置</h1><span id="accountIdentity"></span></header>
    <main class="app-main">
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section id="auth" class="login" aria-labelledby="authTitle">
        <div class="brand">Guitar<span>OCR</span></div>
        <h1 id="authTitle">登录</h1>
        <p id="authReason" hidden></p>
        <p id="authNotice" class="error" role="alert" hidden></p>
        <form id="authForm">
          <label>用户名<input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_\-]+" aria-describedby="usernameHint" /></label>
          <p id="usernameHint" class="hint" hidden>3–32 个字母、数字、下划线或连字符。</p>
          <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" aria-describedby="passwordHint" /></label>
          <p id="passwordHint" class="hint" hidden>至少 10 个字符。</p>
          <div class="row"><button id="authSubmit" class="primary" type="submit">登录</button><button id="authToggle" type="button" hidden>创建账号</button></div>
        </form>
      </section>
      <section data-view="account" hidden>
        <p id="usage" class="hint"></p>
        <form id="passwordForm" class="surface-card narrow">
          <h2>修改密码</h2>
          <label>当前密码<input name="current" type="password" autocomplete="current-password" required maxlength="128" /></label>
          <label>新密码<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="newPasswordHint" /></label>
          <p id="newPasswordHint" class="hint">至少 10 个字符。</p>
          <button type="submit" class="primary">保存密码</button>
        </form>
      </section>
      <section data-view="admin" hidden>
        <div class="heading"><h2>用户</h2><label class="inline"><input id="registration" type="checkbox" />允许新用户注册</label></div>
        <div class="table-scroll"><table>
          <thead><tr><th>用户名</th><th>项目数</th><th>任务用时</th><th>操作</th></tr></thead>
          <tbody id="users"></tbody>
        </table></div>
        <h2>进行中的任务</h2>
        <div id="adminJobs"></div>
      </section>
    </main>
  </body>
</html>
