<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GuitarOCR</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="theme.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Guitar<span>OCR</span></h1>
      <select data-theme-picker aria-label="外观主题">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </header>
    <main>
      <section class="local-card">
        <h2>在这台电脑上使用</h2>
        <p id="localHint">乐谱和识别结果保存在本机。</p>
        <button id="localEdit" class="primary">打开乐谱</button>
        <p id="modelHint" class="small">首次识别需下载约 1.8 GB。打开示例和编辑已有项目无需下载。</p>
      </section>
      <details id="remoteOptions">
        <summary>连接服务器</summary>
        <p class="small">乐谱将上传到服务器处理。</p>
        <form id="remote">
          <label for="serverUrl">服务地址</label>
          <div class="row"><input id="serverUrl" type="url" placeholder="https://ocr.example.com" required /><button type="submit">连接</button></div>
        </form>
      </details>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <progress id="startupProgress" aria-label="正在打开乐谱" hidden></progress>
      <div class="row footer">
        <button id="showData" class="quiet">打开数据文件夹</button>
        <button id="stop" hidden>停止本机识别</button>
      </div>
      <details id="logPanel" hidden><summary>运行日志</summary><pre id="logs"></pre></details>
    </main>
  </body>
</html>
