[package]
name = "guitarocr-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
scrypt = "0.11"
scorelib = { path = "../scorelib" }
guitarocr-engine = { path = "../engine" }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
unicode-casefold = "0.2"
unicode-normalization = "0.1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
libloading = "0.8"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
percent-encoding = "2"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
fs2 = "0.4"
