[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guitarocr"
version = "0.1.0"
description = "GLM-OCR measure-sequence transcription to Guitar Pro 5"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=12.3,<13",
  "PyGuitarPro>=0.7,<1",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
webui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dev = ["httpx>=0.27,<1", "ruff>=0.11,<1", "playwright>=1.51,<2"]
glm-ocr = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "accelerate>=1.11,<2",
  "huggingface-hub>=1.23,<2",
  "peft==0.18.1",
  "safetensors>=0.8,<1",
  "transformers==5.8.0",
]

[project.scripts]
guitarocr-gp = "pipeline.run:main"
guitarocr-data = "datagen.run:main"
guitarocr-web = "webapp.app:main"
guitarocr-check = "shared.environment:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["datagen*", "layout*", "document_info*", "measure_ocr*", "gp5_export*", "pipeline*", "shared*", "webapp*"]
namespaces = false

[tool.setuptools.package-data]
layout = ["configs/*.yaml"]
document_info = ["configs/*.yaml"]
measure_ocr = ["configs/*.yaml", "configs/*.json"]
datagen = ["native-bin/*.dll", "native-source/*.cpp", "native-source/*.h", "native-source/*.ps1", "native-source/toolchain/*"]
webapp = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
