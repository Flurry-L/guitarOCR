Global:
  model: PP-DocLayoutV3
  mode: train
  dataset_dir: database/scores/datasets/layout_train_scan
  device: gpu:0,1,2,3,4,5,6,7
  output: output/layout
CheckDataset:
  convert:
    enable: false
    src_dataset_type: null
  split:
    enable: false
    train_percent: null
    val_percent: null
Train:
  num_classes: 4
  epochs_iters: 6
  batch_size: 4
  learning_rate: 2.0e-05
  pretrain_weight_path: tools/models/layout-checkpoint.pdparams
  warmup_steps: 100
  resume_path: null
  log_interval: 10
  eval_interval: 1
  num_workers: 4
Evaluate:
  weight_path: output/layout/best_model/best_model.pdparams
  log_interval: 10
Export:
  weight_path: output/layout/best_model/best_model.pdparams
Predict:
  batch_size: 1
  model_dir: output/layout/best_model/inference
