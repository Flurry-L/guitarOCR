Global:
  model: PP-DocLayoutV3
  mode: train
  dataset_dir: database/score_support/layout_combined
  device: gpu:0
  output: output/layout
CheckDataset:
  convert:
    enable: false
    src_dataset_type: null
  split:
    enable: false
    train_percent: null
    val_percent: null
Train:
  num_classes: 6
  epochs_iters: 4
  batch_size: 3
  learning_rate: 8.0e-06
  pretrain_weight_path: tools/models/layout-checkpoint.pdparams
  warmup_steps: 50
  resume_path: null
  log_interval: 10
  eval_interval: 1
  num_workers: 4
Evaluate:
  weight_path: output/layout/best_model/best_model.pdparams
  log_interval: 10
Export:
  weight_path: output/layout/best_model/best_model.pdparams
Predict:
  batch_size: 1
  model_dir: output/layout/best_model/inference
